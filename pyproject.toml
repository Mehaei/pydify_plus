[build-system]
requires = ["setuptools>=70", "setuptools_scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydify_plus"
description = "A Python client library for interacting with the Dify API (sync & async)."
dynamic = ["version"]
authors = [
    {name = "Mehaei", email = "pymehaei@gmail.com"},
]
readme = "README.md"
license = "MIT"
license-files = []
keywords = ["dify", "api", "client", "ai", "chat", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0,<1.0.0",
    "httpx-sse>=0.4.0,<1.0.0",
    "anyio>=3.0.0,<5.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "respx>=0.21.0,<1.0.0",
    "black>=23.0.0,<25.0.0",
    "flake8>=6.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pre-commit>=3.0.0,<4.0.0",
]
examples = [
    "python-dotenv>=1.0.0,<2.0.0",
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn[standard]>=0.23.0,<1.0.0",
]

[project.urls]
Homepage = "https://mehaei.github.io"
Documentation = "https://github.com/Mehaei/pydify_plus#readme"
Repository = "https://github.com/Mehaei/pydify_plus"
Issues = "https://github.com/Mehaei/pydify_plus/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pydify_plus*"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
tag_regex = "^(?:v)?(?P<version>\\d+\\.\\d+\\.\\d+(?:[-+.]?[^\\s]*)?)$"
write_to = "pydify_plus/_version.py"
write_to_template = "__version__ = \"{version}\"\n"

[tool.semantic_release]
branch = "master"
commit_parser = "conventional"
tag_format = "v{version}"
version_toml = []
version_variables = []

[tool.black]
line-length = 88
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = [
    "assignment",
    "arg-type",
    "attr-defined",
    "call-arg",
    "misc",
    "no-any-return",
    "no-untyped-def",
    "override",
    "return-value",
    "valid-type",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["pydify_plus"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
